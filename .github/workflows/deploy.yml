name: deploy

# Triggers ONLY on semver version tags. This matches the WIF binding, which is
# ref-constrained at the OIDC assertion level to refs/tags/v* in the
# private ops Terraform. A push to a branch or a workflow_dispatch cannot
# mint a deploy token even if this file were tampered with on a feature
# branch — enforcement is at token-mint time.
#
# The pattern is `v[0-9]*.*.*` (not `v*.*.*`) so the render service's
# `vrender-*` tags (deploy-render.yml) never double-fire the static deploy:
# `vrender-1.0.0` matches `v*.*.*` but NOT `v[0-9]*.*.*`.
on:
  push:
    tags:
      - "v[0-9]*.*.*"

permissions:
  contents: read
  id-token: write # required for WIF OIDC

env:
  # Same host as the did:web DID (tools/gen-did-json.ts) and the hardcoded
  # probe URL in deploy-issuer.yml — a rename must touch all three.
  PUBLIC_HOST: credentials.andamio.io
  GCP_PROJECT: andamio-credentials
  GCP_REGION: us-central1
  GCP_SERVICE: credential-badges
  AR_IMAGE: us-central1-docker.pkg.dev/andamio-credentials/credential-badges/app
  WIF_PROVIDER: projects/780530615158/locations/global/workloadIdentityPools/credential-badges-pool/providers/github-actions
  CICD_SA: credential-badges-cicd-sa@andamio-credentials.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce served-file allowlist
        run: bash scripts/ci/check-allowlist.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Context freeze pin — the tagged checkout must match the immutable pins
        # ci.yml runs only on pull_request and push-to-main, never on tag
        # pushes. Without this step a tag cut from a commit carrying an
        # in-place context mutation would deploy, and the byte probe below
        # would "verify" the mutated bytes against themselves. Dep-free, so
        # no npm install is needed.
        run: node --experimental-strip-types --test tools/context-freeze.test.ts

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CICD_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build + tag (SHA-pinned AND semver; never :latest)
        run: |
          SEMVER="${GITHUB_REF_NAME}"
          docker build -t "${AR_IMAGE}:${GITHUB_SHA}" -t "${AR_IMAGE}:${SEMVER}" .

      - name: Push (immutable AR rejects any re-push of an existing tag)
        run: |
          docker push "${AR_IMAGE}:${GITHUB_SHA}"
          docker push "${AR_IMAGE}:${GITHUB_REF_NAME}"

      - name: Deploy to Cloud Run
        run: |
          # HOLDER_UPSTREAM (#73) wires the same-origin /holder-api/ proxy to the
          # public andamioscan /api/v2 base so the holder viewer reads live
          # on-chain state (andamioscan sends no CORS headers, so a browser can't
          # read it cross-origin). It is a public host, not a secret.
          # --update-env-vars only touches this key, leaving any other service env
          # (e.g. a separately-set RENDER_UPSTREAM) intact.
          gcloud run deploy "${GCP_SERVICE}" \
            --image "${AR_IMAGE}:${GITHUB_REF_NAME}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --platform managed \
            --update-env-vars "HOLDER_UPSTREAM=https://andamioscan.io/api/v2/" \
            --quiet

      - name: Verify Content-Type + reachability on the *.run.app URL
        run: |
          URL=$(gcloud run services describe "${GCP_SERVICE}" --region "${GCP_REGION}" --project "${GCP_PROJECT}" --format='value(status.url)')
          assert_ct() {
            ct=$(curl -sI "${URL}$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
            echo "$1 Content-Type: $ct (expected $2)"
            test "$ct" = "$2"
            curl -sf "${URL}$1" >/dev/null
          }
          # Loop the checked-out context dir so future versions are covered
          # with no edit here (same genericity as the byte-verify step below).
          for f in context/*.jsonld; do
            assert_ct "/$f" application/ld+json
          done
          assert_ct /issuer              application/ld+json
          assert_ct /.well-known/did.json application/did+ld+json
          assert_ct /badges/_placeholder.svg image/svg+xml
          # v1.2 raster artifacts (#69, R9): the download PNG + OG card are new
          # served content types on this lane — probe them on the deployed
          # service, not just the CI docker smoke, so an LB misroute or missing
          # image/png mime regression is caught here too. Real committed stem.
          STEM=ae192632aabe00ed2042eaef596bc15f3887fa32e75e8f9b8fa516df.e9b5343186f83ed804a9fd87293a7378e3b237743b76d56da73b111d855631db
          assert_ct "/badges/$STEM.png"    image/png
          assert_ct "/badges/$STEM.og.png" image/png
          # v1.2 display/share page (#70, R7): the extensionless page is a new
          # served content type + a new nginx nested-location route — probe it on
          # the deployed revision (not just the CI docker smoke) so an LB misroute
          # or a try_files/content-type regression on the real path is caught here.
          assert_ct "/badges/$STEM"        text/html
          curl -sf "${URL}/badges/$STEM" | grep -q 'og:image' || { echo "deployed page missing og:image"; exit 1; }
          # v1.2 embed variant (#71): a new served URL under the same
          # try_files-to-.html routing — probe it on the deployed revision too.
          assert_ct "/badges/$STEM.embed"  text/html
          # v1.2 explainers (#72): two new served URLs — probe them too.
          assert_ct "/badges/how-to-share" text/html
          assert_ct "/badges/how-to-check" text/html
          # v1.2 holder viewer (#73): the nested per-holder route + its static
          # assets are new served surfaces — probe them on the deployed revision so
          # an LB misroute on the two-segment path is caught here, not just in the
          # CI docker smoke. The client reads live state in the browser; this
          # asserts the shell + registry serve. Real flagship stem + real holder.
          assert_ct "/badges/$STEM/james"  text/html
          curl -sf "${URL}/badges/$STEM/james" | grep -q 'data-holder-list' || { echo "deployed holder shell missing render hook"; exit 1; }
          assert_ct "/badges/_registry.json" application/json
          js_ct=$(curl -sI "${URL}/badges/_holder.js" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "/badges/_holder.js Content-Type: $js_ct"
          echo "$js_ct" | grep -qi javascript || { echo "deployed _holder.js not served as javascript"; exit 1; }
          # The holder-state proxy is wired (HOLDER_UPSTREAM set above): a request
          # must not 404 (which would mean the location is missing). 200 (scan up)
          # or 502 (scan momentarily down) both prove wiring without coupling this
          # gate to andamioscan availability.
          holder_api=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/holder-api/users/james/state")
          echo "/holder-api/users/james/state -> $holder_api (expected non-404 — proxy wired)"
          test "$holder_api" != "404"
          # v1.2 web component (#74): the embed bundle is a new served surface —
          # probe it on the deployed revision so an LB misroute on /embed/ is
          # caught here, not just in the CI docker smoke. Real content-shape check.
          embed_ct=$(curl -sI "${URL}/embed/andamio-badge.js" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "/embed/andamio-badge.js Content-Type: $embed_ct"
          echo "$embed_ct" | grep -qi javascript || { echo "deployed andamio-badge.js not served as javascript"; exit 1; }
          curl -sf "${URL}/embed/andamio-badge.js" | grep -q 'customElements.define("andamio-badge"' || { echo "deployed embed bundle missing component definition"; exit 1; }

      - name: Verify served context bytes on the public host (freeze pin, end to end)
        # The freeze-pin step above proves the tagged checkout matches the
        # immutable pins; this closes the checkout-vs-served gap (stale image,
        # LB misroute). Together: served == checkout == pinned. Probing the
        # PUBLIC host, not *.run.app, is deliberate — the issuer lane already
        # paid for that lesson (#62/#63): only the LB route proves what
        # verifiers actually fetch. Loops the checked-out dir, so future
        # context versions are covered with no edit here.
        run: |
          for f in context/*.jsonld; do
            expected=$(sha256sum "$f" | cut -d' ' -f1)
            for attempt in 1 2 3 4 5; do
              # Fetch to a file, not $(...): command substitution strips the
              # trailing newline and would hash different bytes than served.
              if curl -sf "https://${PUBLIC_HOST}/$f" -o served.jsonld; then
                served=$(sha256sum served.jsonld | cut -d' ' -f1)
              else
                served="fetch-failed"
              fi
              [ "$served" = "$expected" ] && break
              if [ "$attempt" -lt 5 ]; then
                echo "attempt $attempt: /$f served=$served expected=$expected — retrying"
                sleep 5
              fi
            done
            echo "/$f sha256: $served (expected $expected)"
            test "$served" = "$expected"
          done
