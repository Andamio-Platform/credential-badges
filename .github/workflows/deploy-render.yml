name: deploy-render

# On-demand badge RENDER service (#33) — the SECOND Cloud Run service.
# Distinct from deploy.yml (the static host). Triggers ONLY on `vrender-*`
# tags. `v[0-9]*.*.*` (the static host's trigger) deliberately does NOT match
# a `vrender-*` ref — so a render release never double-fires the static deploy.
on:
  push:
    tags:
      - "vrender-*"

permissions:
  contents: read
  id-token: write # required for WIF OIDC

env:
  GCP_PROJECT: andamio-credentials
  # The registry region is separate (AR_IMAGE).
  GCP_REGION: europe-west4
  GCP_SERVICE: credential-badges-render
  PUBLIC_HOST: credentials.andamio.io
  AR_IMAGE: us-central1-docker.pkg.dev/andamio-credentials/credential-badges/render
  WIF_PROVIDER: projects/780530615158/locations/global/workloadIdentityPools/credential-badges-pool/providers/github-actions
  CICD_SA: credential-badges-cicd-sa@andamio-credentials.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so the on-main ancestor check below works

      - name: Assert the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "tag commit $GITHUB_SHA is not an ancestor of origin/main — refusing to deploy unreviewed code";
            exit 1;
          }

      - name: Enforce served-file allowlist
        run: bash scripts/ci/check-allowlist.sh

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CICD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${AR_IMAGE%%/*}" --quiet

      # Build context MUST be the repo root: service/Dockerfile ships generator/
      # (render-core + fonts.css) AND service/. Tag with both the commit SHA and
      # the vrender-* tag; never :latest.
      - name: Build + tag (SHA-pinned AND vrender tag; never :latest)
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -f service/Dockerfile -t "${AR_IMAGE}:${GITHUB_SHA}" -t "${AR_IMAGE}:${TAG}" .

      - name: Push (immutable AR rejects any re-push of an existing tag)
        run: |
          docker push "${AR_IMAGE}:${GITHUB_SHA}"
          docker push "${AR_IMAGE}:${GITHUB_REF_NAME}"

      # The render service's runtime configuration is managed outside this
      # workflow. `gcloud run deploy --image` updates ONLY the image and
      # preserves that config — keep this step image-only so it never clobbers it.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${GCP_SERVICE}" \
            --image "${AR_IMAGE}:${GITHUB_REF_NAME}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --platform managed \
            --quiet

      # The probe goes through the PUBLIC host, not the run.app URL: the static
      # host is render's only public path, and run.app does not answer the
      # runner. NO external /healthz probe either: Google's frontend intercepts
      # that literal path (vrender-0.1.2, #66). See
      # docs/solutions/conventions/cloud-run-deploy-verification-probes.md.
      #
      # Every live badge is baked into the static image, so a real badge name
      # is served from the static host's disk and never reaches render. The
      # probe asks for a badge that cannot exist (all-zero course_id): the
      # static host misses and proxies to render, render asks the gateway on
      # each network, and every network answering "no such course" gives a
      # 404 with render's placeholder SVG. An auth or transport failure on any
      # network gives a 502 instead, so this fails on a revision that cannot
      # read the gateway. The course_id must not be a real one: an unknown
      # slt_hash on a real course renders and caches a fallback badge.
      - name: Verify render answers through the public host
        run: |
          NAME="$(printf '0%.0s' $(seq 56)).$(printf '0%.0s' $(seq 64)).svg"
          URL="https://${PUBLIC_HOST}/badges/${NAME}"
          echo "render probe: ${URL}"
          read -r code ct < <(curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "${URL}")
          echo "status ${code}, Content-Type ${ct} (expected 404, image/svg+xml)"
          test "${code}" = "404"
          test "${ct}" = "image/svg+xml"
