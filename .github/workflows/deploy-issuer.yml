name: deploy-issuer

# OB3 issuer service — the THIRD Cloud Run service. Distinct from deploy.yml
# (static host, `v[0-9]*.*.*`) and deploy-render.yml (render service,
# `vrender-*`). Triggers ONLY on `service-v*` tags.
#
# Reads these repo variables (Settings -> Actions -> Variables):
#   ISSUER_GCP_REGION       deploy region
#   ISSUER_AR_IMAGE         Artifact Registry image path for the issuer
#   ISSUER_WIF_PROVIDER     WIF provider resource name for this lane
#   ISSUER_CICD_SA          deploy service-account email for this lane
#   ISSUER_KMS_KEY_VERSION  full CryptoKeyVersion resource name

on:
  push:
    tags:
      - "service-v*"

permissions:
  contents: read
  id-token: write # required for WIF OIDC

env:
  GCP_PROJECT: andamio-credentials
  GCP_SERVICE: credential-badges-issuer
  # Provided as repo variables (see the header).
  GCP_REGION: ${{ vars.ISSUER_GCP_REGION }}
  AR_IMAGE: ${{ vars.ISSUER_AR_IMAGE }}
  WIF_PROVIDER: ${{ vars.ISSUER_WIF_PROVIDER }}
  CICD_SA: ${{ vars.ISSUER_CICD_SA }}
  KMS_KEY_VERSION_NAME: ${{ vars.ISSUER_KMS_KEY_VERSION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run until the required repo variables exist
        run: |
          missing=0
          for v in GCP_REGION AR_IMAGE WIF_PROVIDER CICD_SA KMS_KEY_VERSION_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::repo variable for $v is unset (see the header of this workflow)"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the required repository variables before running this workflow."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history so the on-main ancestor check below works

      - name: Assert the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "tag commit $GITHUB_SHA is not an ancestor of origin/main — refusing to deploy unreviewed code";
            exit 1;
          }

      - name: Enforce served-file allowlist
        run: bash scripts/ci/check-allowlist.sh

      - name: Run the issuer test suite before any deploy step
        working-directory: issuer-service
        run: |
          npm ci
          npm test

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CICD_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        # Registry host from the image path: the registry region
        # and the deploy region (ISSUER_GCP_REGION) move independently.
        run: gcloud auth configure-docker "${AR_IMAGE%%/*}" --quiet

      # Build context MUST be the repo root: the image bakes context/,
      # .well-known/did.json, status/, generator/credentials.json and tools/.
      - name: Build + tag (SHA-pinned AND service-v tag; never :latest)
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -f issuer-service/Dockerfile -t "${AR_IMAGE}:${GITHUB_SHA}" -t "${AR_IMAGE}:${TAG}" .

      - name: Push (immutable AR rejects any re-push of an existing tag)
        run: |
          docker push "${AR_IMAGE}:${GITHUB_SHA}"
          docker push "${AR_IMAGE}:${GITHUB_REF_NAME}"

      # The service's runtime configuration is managed outside this workflow.
      # Keep this step image-only so it never clobbers it.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${GCP_SERVICE}" \
            --image "${AR_IMAGE}:${GITHUB_REF_NAME}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --platform managed \
            --quiet

      # NO external /healthz probe here: Google's front end intercepts
      # /healthz on run.app URLs and answers 404 from the edge — the request
      # never reaches the container (proven 2026-07-21: zero request logs for
      # /healthz while /, /health, and /credentials/* all log). Health is
      # already enforced upstream of this step twice over: the in-container
      # startup probe gates revision readiness on /healthz, and the startup
      # drift check runs BEFORE the listener opens — so a successful rollout
      # proves KMS key == live did.json pin, live context == committed
      # context, and key version fresh in the live status list. The
      # credential probe below is the real end-to-end verification (anchor
      # gate → KMS sign → serve).
      - name: Verify a live signed credential
        run: |
          # The probe goes through the PUBLIC hostname, not the run.app URL:
          # the public route is the one users actually hit.
          URL="https://credentials.andamio.io"
          echo "probing via public host: ${URL}"
          CRED="/credentials/mainnet/ae192632aabe00ed2042eaef596bc15f3887fa32e75e8f9b8fa516df/e9b5343186f83ed804a9fd87293a7378e3b237743b76d56da73b111d855631db/james"
          # GET (the service is GET-only; HEAD is 405 by design).
          code=$(curl -s -o /tmp/cred.json -w '%{http_code}' "${URL}${CRED}")
          ct=$(curl -s -o /dev/null -w '%{content_type}' "${URL}${CRED}")
          echo "${CRED} -> ${code} ${ct} (expected 200 application/ld+json)"
          test "${code}" = "200"
          test "${ct}" = "application/ld+json"
          # The proof block must be present and name the production key, and
          # the credential must reference the current signing context (v1) —
          # otherwise "issuer signs v1" would be verified by eyeball only.
          python3 -c "import json; d=json.load(open('/tmp/cred.json')); p=d['proof'][0]; assert p['cryptosuite']=='eddsa-rdfc-2022' and p['verificationMethod']=='did:web:credentials.andamio.io#key-2026-07', p; assert 'https://credentials.andamio.io/context/v1.jsonld' in d['@context'], d['@context']; print('proof OK:', p['cryptosuite'], p['verificationMethod']); print('context OK: v1')"
